[package]
name = "web"
version = "0.1.0"
edition = "2021"
authors = ["Subeen Pang"]
description = "WebAssembly interface for DMC simulations with CLI tools"
license = "MIT"
repository = "https://github.com/subinbg/Diffusion-MC"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "site"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:pulldown-cmark", "dep:maud", "dep:katex", "dep:tiny_http"]

[dependencies]
# Core simulation
simulation = { path = "../simulation" }

# WebAssembly bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Random number generation (needed for WASM)
getrandom = { version = "0.2", features = ["js"] }

# CLI-only dependencies (feature-gated)
clap = { version = "4", features = ["derive"], optional = true }
pulldown-cmark = { version = "0.12", features = ["html"], optional = true }
maud = { version = "0.26", optional = true }
katex = { version = "0.4", optional = true }
tiny_http = { version = "0.12", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimize for size in WASM
opt-level = "s"
lto = true
