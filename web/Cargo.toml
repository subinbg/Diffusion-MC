[package]
name = "web"
version = "0.1.0"
edition = "2021"
authors = ["Subeen Pang"]
description = "WebAssembly interface for DMC simulations with CLI tools"
license = "MIT"
repository = "https://github.com/subinbg/Diffusion-MC"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "site"
path = "src/main.rs"

[dependencies]
# Core simulation
simulation = { path = "../simulation" }

# WebAssembly bindings
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Random number generation (needed for WASM)
getrandom = { version = "0.2", features = ["js"] }

# CLI and site generation (native only, not for WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
pulldown-cmark = { version = "0.12", features = ["html"] }
maud = "0.26"
katex = "0.4"
tiny_http = "0.12"

[dev-dependencies]
wasm-bindgen-test = "0.3"
