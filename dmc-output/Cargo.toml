[package]
name = "dmc-output"
version = "0.1.0"
edition = "2021"
authors = ["Subeen Pang"]
description = "Output writers and statistics for DMC simulations"
license = "MIT"
repository = "https://github.com/subinbg/Diffusion-MC"
keywords = ["quantum", "monte-carlo", "output"]
categories = ["science"]

[dependencies]
# Core simulation library
dmc-core = { path = "../dmc-core" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Output formats
csv = "1.3"

# Progress bar and console output
indicatif = "0.17"
console = "0.15"

# Error handling
thiserror = "2.0"
