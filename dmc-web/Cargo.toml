[package]
name = "dmc-web"
version = "0.1.0"
edition = "2021"
authors = ["Subeen Pang"]
description = "WebAssembly interface for DMC simulations"
license = "MIT"
repository = "https://github.com/subinbg/Diffusion-MC"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core simulation
dmc-core = { path = "../dmc-core" }

# WebAssembly bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Random number generation (needed for WASM)
# getrandom 0.2 is used by rand 0.8 (via dmc-core), needs "js" feature for WASM
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimize for size in WASM
opt-level = "s"
lto = true
