[package]
name = "simulation"
version = "0.2.0"
edition = "2021"
authors = ["Subeen Pang"]
description = "Diffusion Monte Carlo library for quantum ground state simulations"
license = "MIT"
repository = "https://github.com/subinbg/Diffusion-MC"
keywords = ["quantum", "monte-carlo", "physics", "simulation"]
categories = ["science", "simulation"]

[dependencies]
# Linear algebra
nalgebra = { version = "0.33", features = ["serde-serialize"] }

# Random number generation
rand = "0.8"
rand_distr = "0.4"

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2.0"

[dev-dependencies]
approx = "0.5"
