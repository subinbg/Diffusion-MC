[package]
name = "examples"
version = "0.1.0"
edition = "2021"
authors = ["Subeen Pang"]
description = "Example simulations and output handling for DMC"
license = "MIT"
repository = "https://github.com/subinbg/Diffusion-MC"
keywords = ["quantum", "monte-carlo", "examples"]
categories = ["science"]

[dependencies]
# Core simulation library
simulation = { path = "../simulation" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Output formats
csv = "1.3"

# Progress bar and console output
indicatif = "0.17"
console = "0.15"

# Error handling
thiserror = "2.0"

[[bin]]
name = "hydrogen"
path = "src/bin/hydrogen.rs"

[[bin]]
name = "h2_ion"
path = "src/bin/h2_ion.rs"

[[bin]]
name = "h2_molecule"
path = "src/bin/h2_molecule.rs"
