[package]
name = "dmc-core"
version = "0.1.0"
edition = "2021"
authors = ["Subeen Pang"]
description = "Diffusion Monte Carlo library for quantum ground state simulations"
license = "MIT"
repository = "https://github.com/subinbg/Diffusion-MC"
keywords = ["quantum", "monte-carlo", "physics", "simulation"]
categories = ["science", "simulation"]

[dependencies]
# Linear algebra
nalgebra = "0.33"

# Random number generation
rand = "0.8"
rand_distr = "0.4"

# Parallel iteration
rayon = "1.10"

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Output formats
csv = "1.3"
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Progress bar
indicatif = "0.17"
console = "0.15"

[dev-dependencies]
approx = "0.5"
tempfile = "3.15"

[[example]]
name = "hydrogen_simple"
path = "examples/hydrogen_simple.rs"

[[example]]
name = "h2_from_toml"
path = "examples/h2_from_toml.rs"

[[example]]
name = "h2_ion_demo"
path = "examples/h2_ion_demo.rs"
